<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Wochenplaner</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("wp-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#FFFFFF; --ink:#111111; --muted:#737373; --faint:#A3A3A3; --line:#EBEBEB; --soft:#F6F6F6;
  --accent:#111111; --accent-ink:#FFFFFF;
  --k-termin:#3B6EA8; --k-sport:#3E8A5E; --k-lernen:#7A63B0; --k-arbeit:#B07A2E;
  --k-schule:#737373; --k-pruefung:#C0443F; --k-google:#A3A3A3; --water:#3F86B0; --k-ferien:#C29A2E;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --ink:#F2F2F2; --muted:#8F8F8F; --faint:#5C5C5C; --line:#222222; --soft:#111111;
    --accent:#F2F2F2; --accent-ink:#000000;
    --k-termin:#79A6DA; --k-sport:#74BE92; --k-lernen:#A993DB; --k-arbeit:#D7A767;
    --k-schule:#8F8F8F; --k-pruefung:#E8837E; --k-google:#5C5C5C; --water:#6FB2D8; --k-ferien:#D9B45A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --ink:#F2F2F2; --muted:#8F8F8F; --faint:#5C5C5C; --line:#222222; --soft:#111111;
  --accent:#F2F2F2; --accent-ink:#000000;
  --k-termin:#79A6DA; --k-sport:#74BE92; --k-lernen:#A993DB; --k-arbeit:#D7A767;
  --k-schule:#8F8F8F; --k-pruefung:#E8837E; --k-google:#5C5C5C; --water:#6FB2D8; --k-ferien:#D9B45A;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button,.tab,.chip,.fact,.bottle,.habit{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (display-mode: standalone){html,body{min-height:100%}}
.login{max-width:360px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.login h2{margin:0 0 4px;font-size:1.8rem;letter-spacing:-.02em}
.login input{font-size:16px;padding:12px 14px;border-radius:12px}
.login .btn{padding:12px;font-size:1rem;border-radius:12px}
.login .row{display:flex;gap:8px}.login .row .btn{flex:1}
body.auth .top .nav,body.auth .tabs,body.auth .tabbar,body.auth .sync{display:none}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding:22px 24px 48px}

/* Kopf */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.title h1{margin:0;font-size:1.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.title p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.nav{display:flex;align-items:center;gap:4px}
.icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;color:var(--ink)}
.icon:hover{background:var(--soft)}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:500}
.pill:hover{background:var(--soft)}
.sync{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px;margin-top:4px}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
.sync[data-s="ok"]::before{background:var(--k-sport)}
.sync[data-s="saving"]::before{background:var(--k-arbeit)}
.sync[data-s="err"]::before,.sync[data-s="local"]::before{background:var(--k-pruefung)}

/* Reiter */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 0 11px;font-size:.95rem;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabbar{display:none}

.banner{margin:0 0 18px;padding:10px 14px;border-radius:10px;background:var(--soft);font-size:.9rem}

/* Allgemein */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 14px}
.dayhead h2{margin:0;font-size:1.3rem;font-weight:600;letter-spacing:-.01em}
.dayhead .muted{font-size:.88rem}
.block{padding:16px 0;border-top:1px solid var(--line)}
.block:first-child{border-top:0;padding-top:0}
.bh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.bh h3{margin:0;font-size:.95rem;font-weight:600}
.bh .muted{font-size:.85rem}
.link{color:var(--muted);font-size:.88rem;font-weight:500;border-radius:6px;padding:2px 4px}
.link:hover{color:var(--ink)}
.link.small{font-size:.8rem}
.btn{border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.9rem;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{color:var(--muted);font-size:.9rem;margin:2px 0}
.note{color:var(--muted);font-size:.82rem;margin:8px 0 0}
.note.bad{color:var(--k-pruefung)}
.x{color:var(--faint);font-size:1.15rem;line-height:1;padding:4px 7px;border-radius:6px}
.x:hover{color:var(--k-pruefung);background:var(--soft)}
input[type=text],input[type=time],input[type=date],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0;outline:none}
input:focus,select:focus{border-color:var(--ink)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--k-termin);flex:none}
.k-termin{background:var(--k-termin)}.k-sport{background:var(--k-sport)}.k-lernen{background:var(--k-lernen)}.k-arbeit{background:var(--k-arbeit)}
.k-schule{background:var(--k-schule)}.k-ferien{background:var(--k-ferien)}.k-pruefung{background:var(--k-pruefung)}.k-google{background:transparent;box-shadow:inset 0 0 0 1.5px var(--k-google)}

/* Tagesleiste */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:22px}
.chip{border-radius:12px;padding:8px 0 7px;text-align:center;line-height:1.1}
.chip:hover{background:var(--soft)}
.chip small{display:block;font-size:.75rem;color:var(--muted);margin-bottom:3px}
.chip b{font-size:1.15rem;font-weight:600}
.chip .pip{display:block;width:4px;height:4px;border-radius:50%;margin:5px auto 0;background:transparent}
.chip .pip.on{background:var(--faint)}
.chip.today b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.chip.sel{background:var(--accent);color:var(--accent-ink)}
.chip.sel small{color:inherit;opacity:.7}
.chip.sel .pip.on{background:var(--accent-ink)}

/* Tag */
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;align-items:start}
.stack .block:first-child{border-top:0;padding-top:0}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:62px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.item:last-child{border-bottom:0}
.item time{font-size:.88rem;font-weight:600;font-variant-numeric:tabular-nums}
.item time small{display:block;font-weight:400;color:var(--muted)}
.item .t{font-weight:500;overflow-wrap:anywhere;color:inherit;text-decoration:none}
.item a.t:hover{text-decoration:underline}
.item .m{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-top:2px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px;padding:14px;border-radius:12px;background:var(--soft)}
.form .full{grid-column:1/-1}
.form label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.form .row{grid-column:1/-1;display:flex;justify-content:flex-end}
.todos{list-style:none;margin:0;padding:0}
.todo{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.todo input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
.todo span{flex:1;overflow-wrap:anywhere}
.todo.done span{color:var(--faint);text-decoration:line-through}
.add{display:flex;gap:8px;margin-top:10px;align-items:center}
.add input{flex:1}
.water{display:flex;flex-wrap:wrap;gap:6px}
.glass{width:26px;height:34px;border:1.5px solid var(--line);border-radius:3px 3px 8px 8px;position:relative;overflow:hidden}
.glass::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:var(--water)}
.glass.on{border-color:var(--water)}
.glass.on::after{height:78%}
.habits{display:flex;flex-wrap:wrap;gap:8px}
.habit{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.9rem}
.habit:hover{background:var(--soft)}
.habit[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Woche */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wday{display:flex;flex-direction:column;text-align:left;min-height:360px;padding:12px 10px;border-left:1px solid var(--line)}
.wday:first-child{border-left:0}
.wday:hover{background:var(--soft)}
.wh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.wh span{font-size:.8rem;color:var(--muted)}
.wh b{font-size:1.2rem;font-weight:600}
.wday.today .wh b{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 8px}
.wl{display:flex;flex-direction:column;gap:7px}
.wi{display:grid;grid-template-columns:auto auto 1fr;gap:5px;align-items:center;font-size:.78rem;line-height:1.25}
.wi time{color:var(--muted);font-variant-numeric:tabular-nums}
.wi span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wi.muted{display:block;color:var(--faint)}
.wf{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:.75rem;color:var(--muted)}
.meter{display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--water)}

/* Schule */
.count{display:flex;align-items:baseline;gap:10px;margin:4px 0 16px}
.count b{font-size:2.6rem;font-weight:700;letter-spacing:-.03em;line-height:1}
.count span{color:var(--muted)}
.count strong{color:var(--ink);font-weight:600}
.rows{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:130px 96px 96px 1fr 90px auto;gap:8px;align-items:center}
.prow{display:grid;grid-template-columns:150px 96px 1fr auto;gap:8px;align-items:center}
.prow.past{opacity:.5}
.hrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.switch{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;margin-bottom:14px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.switch small{grid-column:2;font-size:.8rem}

/* Fortschritt */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-bottom:22px}
.stat b{display:block;font-size:1.8rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;max-width:520px}
.barcol{text-align:center}
.bartrack{height:110px;background:var(--soft);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.bartrack i{display:block;width:100%;background:var(--water);border-radius:8px 8px 0 0}
.barcol small{font-size:.78rem;color:var(--muted)}
.scroll{overflow-x:auto}
.matrix{border-collapse:collapse;font-size:.88rem}
.matrix th{font-weight:500;color:var(--muted);padding:6px 8px;text-align:center;font-size:.8rem}
.matrix tbody th{text-align:left;color:var(--ink);font-size:.9rem;padding-left:0;white-space:nowrap}
.matrix td{padding:4px 6px;text-align:center}
.cell{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line)}
.cell.on{background:var(--accent);border-color:var(--accent)}

/* Einstellungen */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:7px;font-size:.9rem;font-weight:500;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
.num{max-width:90px}

@media (max-width: 860px){
  .cols{grid-template-columns:minmax(0,1fr);gap:0}
  .stack{border-top:1px solid var(--line);padding-top:16px}
  .week{grid-template-columns:minmax(0,1fr);border-radius:14px}
  .wday{min-height:0;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:48px 1fr;gap:4px 12px}
  .wday:first-child{border-top:0}
  .wh{flex-direction:column;align-items:flex-start;margin:0;grid-row:span 2}
  .wf{grid-column:2;padding-top:6px;flex-direction:row;justify-content:space-between;align-items:center}
  .wf .meter{width:80px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .srow{grid-template-columns:1fr 1fr 1fr auto}
  .srow .grow{grid-column:1/3}.srow .raum{grid-column:3/4}
  .prow{grid-template-columns:1fr 1fr auto}
  .prow .grow{grid-column:1/3}
}
@media (max-width: 640px){
  .wrap{padding:14px 16px calc(84px + env(safe-area-inset-bottom,0px))}
  .tabs{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
    padding:6px 4px env(safe-area-inset-bottom,0px)}
  .tabbar .tab{flex:1;border:0;margin:0;padding:10px 0;font-size:.78rem;text-align:center}
  .tabbar .tab[aria-selected="true"]{color:var(--ink);font-weight:600}
  .title h1{font-size:1.35rem}
  .pill{padding:5px 11px}
  .strip{gap:2px;margin-bottom:18px}
  .top{margin-bottom:16px}
}

/* ---- Feinschliff v3 ---- */
.wrap{max-width:1040px;padding-top:28px}
.title p{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sync{margin:0;font-size:.75rem}
.tabs{gap:26px;margin:22px 0 28px}
.tab{display:inline-flex;align-items:center;gap:6px}
.banner{background:none;border:1px solid var(--line);color:var(--muted);font-size:.85rem}
.block{border-top:0;padding:0;margin-bottom:34px}
.bh{margin-bottom:12px}
.bh h3{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.01em}
.dayhead{margin-bottom:22px}
.dayhead h2{font-size:1.75rem;font-weight:700;letter-spacing:-.025em}
.next{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:baseline;padding:14px 16px;margin:-8px 0 30px;border-radius:12px;background:var(--soft);font-size:.95rem}
.next strong{font-weight:600}
.cols{gap:64px}
.stack{border-top:0!important}
/* Tagesleiste: ruhiger */
.strip{margin-bottom:30px;gap:4px}
.chip{padding:10px 0 9px}
.chip.sel{background:var(--soft);color:var(--ink)}
.chip.sel small{opacity:1;color:var(--muted)}
.chip.sel b{font-weight:700}
.chip.sel .pip.on{background:var(--faint)}
.chip.today b{text-decoration:none}
.chip.today small{color:var(--ink);font-weight:600}
.chip.today .pip{background:var(--ink)!important}
/* Termine */
.item{border-bottom:0;padding:9px 0;grid-template-columns:58px 1fr auto}
.item time small{color:var(--faint)}
.item .x{opacity:0}
.item:hover .x,.item .x:focus-visible{opacity:1}
@media (hover:none){.item .x{opacity:1}}
/* To-dos mit runden Haken */
.todo{border-bottom:0;padding:7px 0}
.todo input{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.5px solid var(--faint);border-radius:50%;display:grid;place-items:center;cursor:pointer}
.todo input:checked{background:var(--accent);border-color:var(--accent)}
.todo input:checked::after{content:"";width:5px;height:9px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:translate(0,-1px) rotate(45deg)}
.todo .link,.todo .x{opacity:0}
.todo:hover .link,.todo:hover .x,.todo .link:focus-visible,.todo .x:focus-visible{opacity:1}
@media (hover:none){.todo .link,.todo .x{opacity:1}}
.add input{border-color:transparent;background:var(--soft)}
.add input:focus{background:var(--bg);border-color:var(--ink)}
.add .btn{border-color:transparent;background:var(--soft)}
/* Wasser als Punkte */
.water{gap:8px}
.glass{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line)}
.glass::after{display:none}
.glass.on{background:var(--water);border-color:var(--water)}
/* Woche */
.week{border:0;border-radius:0;gap:0}
.wday{border-left:1px solid var(--line);padding:4px 12px 12px}
.wday:first-child{border-left:0;padding-left:0}
.wday:hover{background:none}
.wday:hover .wh b{text-decoration:underline;text-underline-offset:4px}
.wh{margin-bottom:14px}
.wday.today .wh b{background:none;color:var(--ink);padding:0}
.wday.today .wh span{color:var(--ink);font-weight:600}
/* Fortschritt */
.stat{padding-top:10px;border-top:2px solid var(--ink)}
.stats{margin-bottom:40px}
/* Handy-Leiste mit Icons */
.ti svg{width:22px;height:22px;display:block;margin:0 auto 3px}
@media (max-width:860px){
  .wday{border-left:0!important;padding:12px 0}
  .cols{gap:0}
  .next{grid-template-columns:1fr;gap:2px}
}
@media (max-width:640px){
  .dayhead h2{font-size:1.45rem}
  .tabbar{padding-top:4px;backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);background:color-mix(in srgb,var(--bg) 88%,transparent)}
  .tabbar .tab{flex-direction:column;gap:0;padding:6px 0 4px;font-size:.7rem}
  .strip{margin-bottom:22px}
  .cols .stack{margin-top:6px}
}
/* ---- v4 ---- */
.form .check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:.9rem;cursor:pointer}
.form .check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.wdpick{display:flex;gap:4px;flex-wrap:wrap}
.wdpick[hidden]{display:none}
.wdpick button{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:.85rem}
.wdpick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sleep{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sleep label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted)}
.quick{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.quick .btn{flex:1;border-color:transparent;background:var(--soft)}
.goals{margin-bottom:30px}
.subtabs{margin:-6px 0 26px}
.lstat{margin-bottom:26px}
.lbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft)}

<script>
"use strict";


/* ---------- Helfer ---------- */
function h(tag, attrs, ...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==="class") el.className=v;
    else if(k==="text") el.textContent=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(k==="value") el.value=v;
    else if(k==="checked") el.checked=!!v;
    else el.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat()){
    if(c==null||c===false) continue;
    el.append(c.nodeType?c:document.createTextNode(String(c)));
  }
  return el;
}
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseIso=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();return {year:y,week:Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)}}
const weekKeyOf=d=>{const w=isoWeek(d);return `${w.year}-W${pad(w.week)}`};
function withOffset(d){const o=-d.getTimezoneOffset(),a=Math.abs(o);return `${isoOf(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:00${o>=0?"+":"-"}${pad(Math.floor(a/60))}:${pad(a%60)}`}
const hhmm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const DAYS=["Mo","Di","Mi","Do","Fr","Sa","So"];
const DAYS_LONG=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const MONTHS=["Jan.","Feb.","März","Apr.","Mai","Juni","Juli","Aug.","Sep.","Okt.","Nov.","Dez."];
const KINDS={termin:"Termin",sport:"Sport",lernen:"Lernen",arbeit:"Arbeit"};
const fmtDay=d=>`${d.getDate()}. ${MONTHS[d.getMonth()]}`;
const todayIso=()=>isoOf(new Date());

/* ---------- Zustand ---------- */
const defaultSettings=()=>({
  waterGoal:3, waterLiter:true, theme:"system",
  habits:[{id:"h1",name:"Sport"},{id:"h2",name:"30 min lernen"},{id:"h3",name:"Vor 23 Uhr ins Bett"}],
  stundenplan:[], pruefungen:[], wiederkehrend:[], lernplan:[], ferien:[], abRef:"2026-09-28"
});
const S={
  db:null, uid:null, persist:false, mcp:null,
  settings:defaultSettings(),
  monday:mondayOf(new Date()), selected:todayIso(),
  week:{days:{}}, memWeeks:{},
  google:{status:"loading",events:[],msg:"",key:""},
  sync:"init", showForm:false, tab:"start", auth:"boot"
};
function normSettings(d){
  const s=Object.assign(defaultSettings(),d||{});
  s.habits=Array.isArray(s.habits)?s.habits:[];
  s.stundenplan=Array.isArray(s.stundenplan)?s.stundenplan:[];
  s.pruefungen=Array.isArray(s.pruefungen)?s.pruefungen:[];
  s.wiederkehrend=Array.isArray(s.wiederkehrend)?s.wiederkehrend:[];
  s.lernplan=Array.isArray(s.lernplan)?s.lernplan:[];
  s.ferien=Array.isArray(s.ferien)?s.ferien:[];
  if(typeof s.abRef!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(s.abRef)) s.abRef="2026-09-28";
  if(!s.waterLiter){s.waterGoal=3;s.waterLiter=true}
  s.waterGoal=Math.max(1,Math.min(10,+s.waterGoal||3));
  if(!["system","light","dark"].includes(s.theme)) s.theme="system";
  return s;
}
function normWeek(d){const w=d||{};w.days=w.days&&typeof w.days==="object"?w.days:{};w.goals=Array.isArray(w.goals)?w.goals:[];w.skip=Array.isArray(w.skip)?w.skip:[];return w}
function day(iso,create){
  let d=S.week.days[iso];
  if(!d){d={todos:[],termine:[],water:0,habits:{}}; if(create) S.week.days[iso]=d;}
  d.todos=d.todos||[];d.termine=d.termine||[];d.habits=d.habits||{};d.water=+d.water||0;d.sleep=d.sleep||{};
  return d;
}

/* ---------- Speichern ---------- */
class Saver{
  constructor(){this.t=null;this.busy=false;this.again=false;this.fn=null}
  pending(){return this.t!==null||this.busy}
  schedule(fn){this.fn=fn;clearTimeout(this.t);setSync("saving");this.t=setTimeout(()=>{this.t=null;this.run()},450)}
  async run(){
    if(this.busy){this.again=true;return}
    this.busy=true;
    const fn=this.fn;
    try{await fn();setSync("ok")}
    catch(e){
      if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await fn();setSync("ok")}catch(e2){setSync("err",e2)}}
      else setSync(e&&e.code==="offline"?"offline":"err",e);
    }
    this.busy=false;
    if(this.again){this.again=false;this.run()}
  }
}
const weekSavers={}; const settingsSaver=new Saver();
const saverFor=k=>weekSavers[k]||(weekSavers[k]=new Saver());
const weekRef=k=>S.db.doc(`data/users/${S.uid}/w-${k}`);
const settingsRef=()=>S.db.doc(`data/users/${S.uid}/settings`);

function saveWeek(){
  const key=weekKeyOf(S.monday), data=clone(S.week);
  S.memWeeks[key]=data;
  if(!S.persist){render();return}
  saverFor(key).schedule(()=>weekRef(key).set(data));
  render();
}
function saveSettings(){
  const data=clone(S.settings);
  if(S.persist) settingsSaver.schedule(()=>settingsRef().set(data));
  render();
}
function setSync(s,err){
  S.sync=s;
  const el=document.getElementById("sync");
  const txt={init:"Verbinde …",ok:"Synchronisiert",saving:"Speichert …",
    err:"Speichern fehlgeschlagen"+(err&&err.code==="quota_exceeded"?": Speicher voll":""),
    local:"Nicht gespeichert",offline:"Offline, wird später gespeichert"}[s];
  el.dataset.s=s; el.textContent=txt;
}

/* ---------- Vorbelegung ---------- */
const BW_FERIEN=[

let gUnsub=null;
function parseGoogle(result){
  let p=result&&result.payload;
  if(typeof p==="string"){try{p=JSON.parse(p)}catch(_){p=null}}
  if(!p&&result&&Array.isArray(result.content)){
    const t=result.content.find(c=>c.type==="text");
    if(t){try{p=JSON.parse(t.text)}catch(_){}}
  }
  const evs=(p&&Array.isArray(p.events))?p.events:[];
  const out=[];
  for(const e of evs){
    if(!e||e.status==="cancelled"||!e.start) continue;
    const title=e.summary||"(ohne Titel)", link=e.htmlLink||"";
    if(e.start.dateTime){
      const s=new Date(e.start.dateTime), en=e.end&&e.end.dateTime?new Date(e.end.dateTime):null;
      out.push({iso:isoOf(s),start:hhmm(s),end:en?hhmm(en):"",title,link,loc:e.location||""});
    }else if(e.start.date){
      let d=parseIso(e.start.date); const stop=e.end&&e.end.date?parseIso(e.end.date):addDays(d,1);
      let guard=0;
      while(d<stop&&guard++<60){out.push({iso:isoOf(d),start:"",end:"",title,link,loc:e.location||""});d=addDays(d,1)}
    }
  }
  return out;
}

function watchGoogle(){

function itemsFor(iso){
  const wd=(parseIso(iso).getDay()+6)%7, items=[];
  const fer=ferienAm(iso), ab=abOf(mondayOf(parseIso(iso))), inWk=mondayOf(parseIso(iso)).getTime()===S.monday.getTime();
  for(const f of fer) items.push({kind:"ferien",title:f.name,start:"",end:"",meta:f.typ==="feiertag"?"Feiertag":"Schulferien"});
  if(!(inWk&&S.week.noSchool)&&!fer.length){
    for(const s of S.settings.stundenplan) if(+s.wd===wd&&(!s.rhythmus||s.rhythmus==="jede"||s.rhythmus===ab))
      items.push({kind:"schule",title:s.fach||"Unterricht",start:s.von||"",end:s.bis||"",meta:s.raum?`Raum ${s.raum}`:"Berufsschule"});
  }
  for(const p of S.settings.pruefungen) if(p.date===iso)
    items.push({kind:"pruefung",title:`Prüfung: ${p.fach||"ohne Fach"}`,start:p.zeit||"",end:"",meta:"Prüfung"});
  if(inWk) for(const t of day(iso).termine) items.push({...t,own:true,meta:KINDS[t.kind]||"Termin"});
  items.push(...eventItems(iso));
  const skip=inWk?(S.week.skip||[]):[];
  for(const r of S.settings.wiederkehrend) if((r.wds||[]).includes(wd)&&!skip.includes(r.id+"@"+iso))
    items.push({kind:r.kind||"termin",title:r.title,start:r.von||"",end:r.bis||"",rec:r.id,meta:`${KINDS[r.kind]||"Termin"}, jede Woche`});
  for(const g of S.google.events) if(g.iso===iso)
    items.push({kind:"google",title:g.title,start:g.start,end:g.end,link:g.link,meta:g.loc?`Google Kalender, ${g.loc}`:"Google Kalender"});
  items.sort((a,b)=>(a.start||"").localeCompare(b.start||""));
  return items;
}

async function mutateAnyDay(iso,fn){

  const key=weekKeyOf(target); let data;
  if(S.persist){try{const snap=await weekRef(key).get();data=snap.exists?normWeek(clone(snap.data())):normWeek({})}catch(e){setSync("err",e);return}}
  else data=normWeek(clone(S.memWeeks[key]||{}));

  S.memWeeks[key]=data;

}
async function moveTodo(iso,todo){
  const tIso=isoOf(addDays(parseIso(iso),1));
  mutateDay(iso,d=>{d.todos=d.todos.filter(t=>t.id!==todo.id)});

}
async function moveTodoOld(iso,todo){

  const moved={id:uid(),text:todo.text,done:false};
  mutateDay(iso,d=>{d.todos=d.todos.filter(t=>t.id!==todo.id)});
  if(tIso in S.week.days||mondayOf(target).getTime()===S.monday.getTime()){
    mutateDay(tIso,d=>{d.todos.push(moved)});
    return;
  }
  const key=weekKeyOf(target);
  const other=normWeek(clone(S.memWeeks[key]||{days:{}}));
  if(S.persist){
    try{
      const snap=await weekRef(key).get();
      const data=snap.exists?normWeek(clone(snap.data())):{days:{}};
      (data.days[tIso]=data.days[tIso]||{todos:[],termine:[],water:0,habits:{}}).todos=(data.days[tIso].todos||[]).concat(moved);
      S.memWeeks[key]=data;
      saverFor(key).schedule(()=>weekRef(key).set(data));
    }catch(e){setSync("err",e)}
  }else{
    (other.days[tIso]=other.days[tIso]||{todos:[],termine:[],water:0,habits:{}}).todos.push(moved);
    S.memWeeks[key]=other;
  }
}

const toMin=t=>{const [a,b]=(t||"0:0").split(":").map(Number);return a*60+(b||0)};
function timeGrid(cols,opts){
  opts=opts||{};

  cols.forEach(c=>c.items.forEach(it=>{if(!it.start)return;const s=toMin(it.start),e=it.end?toMin(it.end):s+45;min=Math.min(min,s);max=Math.max(max,e)}));
  min=Math.floor(min/60)*60; max=Math.ceil(max/60)*60;
  const ppm=window.innerWidth<640?0.95:1.05, H=(max-min)*ppm;
  const grid=h("div",{class:"tg",style:`--cols:${cols.length};--hour:${60*ppm}px`});
  grid.append(h("div",{class:"tg-corner"}),...cols.map(c=>h(c.onclick?"button":"div",{class:`tg-dh${c.today?" today":""}`,onclick:c.onclick||null},h("span",{text:c.label}),c.date?h("b",{text:c.date}):null)));
  const anyAll=cols.some(c=>c.items.some(it=>!it.start));
  if(anyAll){
    grid.append(h("div",{class:"tg-alllabel"}),...cols.map(c=>h("div",{class:"tg-all"},c.items.filter(it=>!it.start).map(it=>h("div",{class:`tg-chip c-${it.kind}`,title:it.title,text:it.title})))));
  }
  const axis=h("div",{class:"tg-axis",style:`height:${H}px`});
  for(let m=min;m<=max;m+=60) axis.append(h("span",{style:`top:${(m-min)*ppm}px`,text:`${pad(m/60)}:00`}));
  grid.append(axis);
  const now=new Date(), nowM=now.getHours()*60+now.getMinutes();
  for(const c of cols){
    const col=h("div",{class:"tg-col",style:`height:${H}px`});
    const timed=c.items.filter(it=>it.start).map(it=>({it,s:toMin(it.start),e:Math.max(toMin(it.start)+20,it.end?toMin(it.end):toMin(it.start)+45)})).sort((a,b)=>a.s-b.s);
    const lanes=[]; timed.forEach(x=>{let l=lanes.findIndex(end=>end<=x.s);if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=x.e;x.lane=l});
    // Cluster-Breite: gleichzeitige Überlappungen
    timed.forEach(x=>{x.n=Math.max(...timed.filter(y=>y.s<x.e&&y.e>x.s).map(y=>y.lane))+1});
    for(const x of timed){
      const it=x.it, hgt=(x.e-x.s)*ppm-3;
      col.append(h(c.onclick||it.ev?"button":"div",{class:`blk c-${it.kind}`,onclick:it.ev&&c.iso?()=>openEditor({id:it.ev,occ:c.iso}):(c.onclick||null),title:`${it.start}${it.end?"–"+it.end:""} ${it.title}${it.meta?", "+it.meta:""}`,
        style:`top:${(x.s-min)*ppm+1}px;height:${hgt}px;left:calc(${x.lane/x.n*100}% + 2px);width:calc(${100/x.n}% - 4px)`},
        h("b",{text:it.title}),hgt>34&&it.meta?h("span",{text:it.meta}):null,hgt>52?h("small",{text:`${it.start}${it.end?"–"+it.end:""}`}):null));
    }
    if(c.today&&nowM>=min&&nowM<=max) col.append(h("i",{class:"tg-now",style:`top:${(nowM-min)*ppm}px`}));
    grid.append(col);
  }
  return grid;
}

    const set=(k,v)=>upd(()=>{const r=st.ferien.find(x=>x.id===f.id);if(r)r[k]=v});
    rows.append(h("div",{class:`frow${(f.bis||f.von)<t?" past":""}`},
      h("i",{class:`dot k-${f.typ==="feiertag"?"pruefung":"ferien"}`}),
      h("input",{type:"text",value:f.name,"aria-label":"Name","data-keep":"fn-"+f.id,onchange:e=>set("name",e.target.value.trim()||f.name)}),
      h("input",{type:"date",value:f.von||"","aria-label":"Von",onchange:e=>set("von",e.target.value)}),
      h("input",{type:"date",value:f.bis||"","aria-label":"Bis",onchange:e=>set("bis",e.target.value)}),
      h("button",{class:"x","aria-label":`${f.name} löschen`,onclick:()=>upd(()=>{st.ferien=st.ferien.filter(x=>x.id!==f.id)})},"×")));
  });
  sec.append(rows); m.append(sec);
}

/* Fortschritt */
function viewFortschritt(m){
  let td=0,tt=0,w=0,hd=0,sport=0;
  const days=[];
  for(let i=0;i<7;i++){const iso=isoOf(addDays(S.monday,i)),dd=day(iso);days.push([iso,dd]);
    tt+=dd.todos.length;td+=dd.todos.filter(t=>t.done).length;w+=dd.water;hd+=S.settings.habits.filter(x=>dd.habits[x.id]).length;sport+=dd.termine.filter(t=>t.kind==="sport").length}
  const sl=days.map(([,dd])=>sleepMins(dd.sleep)).filter(x=>x!=null);
  const avg=sl.length?Math.round(sl.reduce((a,b)=>a+b,0)/sl.length):null;
  const stat=(b,s)=>h("div",{class:"stat"},h("b",{text:b}),h("span",{text:s}));
  const gd=S.week.goals.filter(x=>x.done).length;
  m.append(h("div",{class:"dayhead"},h("h2",{text:"Fortschritt"}),h("span",{class:"muted",text:`Woche ${isoWeek(S.monday).week}`})),
    h("div",{class:"stats"},stat(`${td}/${tt}`,"To-dos erledigt"),stat(`${w} l`,`Wasser, Ziel ${S.settings.waterGoal*7} l`),
      stat(`${hd}/${S.settings.habits.length*7}`,"Gewohnheiten"),stat(String(sport),"Sporteinheiten"),
      stat(S.week.goals.length?`${gd}/${S.week.goals.length}`:"–","Wochenziele"),stat(avg==null?"–":`${Math.floor(avg/60)}:${pad(avg%60)} h`,"Schlaf im Schnitt")));
  const sb=h("div",{class:"bars"},days.map(([iso,dd],i)=>{const mm=sleepMins(dd.sleep);return h("div",{class:"barcol",title:mm==null?"":fmtDur(mm)},
    h("div",{class:"bartrack"},h("i",{class:"sl",style:`height:${mm==null?0:Math.min(100,mm/600*100)}%`})),h("small",{text:DAYS[i]}),h("small",{class:"v",text:mm==null?"":(mm/60).toFixed(1).replace(".",",")}))}));
  m.append(h("section",{class:"block"},h("div",{class:"bh"},h("h3",{text:"Schlaf pro Nacht in Stunden"})),sl.length?sb:h("p",{class:"empty",text:"Trag im Reiter Tag ein, wann du eingeschlafen und aufgestanden bist."})));
  // Wasser pro Tag
  const goal=S.settings.waterGoal;
  m.append(h("section",{class:"block"},h("div",{class:"bh"},h("h3",{text:"Wasser pro Tag in Litern"})),
    h("div",{class:"bars"},days.map(([iso,dd],i)=>h("div",{class:"barcol"},h("div",{class:"bartrack"},h("i",{style:`height:${Math.min(100,dd.water/goal*100)}%`})),h("small",{text:DAYS[i]}))))));
  // Gewohnheiten-Matrix
  if(S.settings.habits.length){
    const tbl=h("table",{class:"matrix"},h("thead",{},h("tr",{},h("th",{}),DAYS.map(d=>h("th",{text:d})))),
      h("tbody",{},S.settings.habits.map(hb=>h("tr",{},h("th",{scope:"row",text:hb.name}),days.map(([iso,dd])=>h("td",{},h("button",{class:`cell${dd.habits[hb.id]?" on":""}`,"aria-label":`${hb.name} am ${iso}`,"aria-pressed":String(!!dd.habits[hb.id]),onclick:()=>mutateDay(iso,x=>{x.habits[hb.id]=!x.habits[hb.id]})})))))));
    m.append(h("section",{class:"block"},h("div",{class:"bh"},h("h3",{text:"Gewohnheiten"})),h("div",{class:"scroll"},tbl)));
  }
}

/* Einstellungen */
function viewSettings(m){
  const st=S.settings, upd=fn=>{fn();saveSettings()};
  m.append(h("div",{class:"dayhead"},h("h2",{text:"Einstellungen"})));
  m.append(h("section",{class:"block"},h("div",{class:"bh"},h("h3",{text:"Darstellung"})),
    h("div",{class:"seg",role:"radiogroup","aria-label":"Farbschema"},[["system","Automatisch"],["light","Hell"],["dark","Dunkel"]].map(([k,l])=>
      h("button",{role:"radio","aria-checked":String(st.theme===k),onclick:()=>upd(()=>{st.theme=k})},l))),
    h("p",{class:"note",text:"Automatisch folgt der Einstellung von Mac bzw. iPhone."})));

  const hrow=h("div",{class:"rows"});
  st.habits.forEach(hb=>hrow.append(h("div",{class:"hrow"},
    h("input",{type:"text",value:hb.name,"aria-label":"Gewohnheit","data-keep":"hb-"+hb.id,onchange:e=>upd(()=>{const r=st.habits.find(x=>x.id===hb.id);if(r)r.name=e.target.value.trim()||r.name})}),
    h("button",{class:"x","aria-label":"Gewohnheit löschen",onclick:()=>upd(()=>{st.habits=st.habits.filter(x=>x.id!==hb.id)})},"×"))));
  const hin=h("input",{type:"text",placeholder:"z.B. Lesen, Dehnen","aria-label":"Neue Gewohnheit","data-keep":"hb-new"});
  const addH=()=>{const v=hin.value.trim();if(v){hin.value="";upd(()=>{st.habits.push({id:uid(),name:v})})}};
  hin.addEventListener("keydown",e=>{if(e.key==="Enter")addH()});
  m.append(h("section",{class:"block"},h("div",{class:"bh"},h("h3",{text:"Gewohnheiten"})),hrow,h("div",{class:"add"},hin,h("button",{class:"btn",onclick:addH},"Hinzufügen"))));

  const RE=S.events.filter(e=>e.repeat&&e.repeat!=="none");
  m.append(h("section",{class:"block"},h("div",{class:"bh"},h("h3",{text:"Wiederkehrende Termine"})),
    RE.length?itemList(todayIso(),RE.map(e=>({kind:e.kind,title:e.title,start:e.allDay?"":e.von,end:e.allDay?"":e.bis,ev:e.id,
      meta:[(REPEAT.find(r=>r[0]===e.repeat)||[])[1],e.repeat==="weekly"?(e.wds||[]).map(i=>DAYS[i]).join(", "):"",e.until?`bis ${fmtDay(parseIso(e.until))}`:""].filter(Boolean).join(", ")}))):
      h("p",{class:"empty",text:"Noch keine. Beim Anlegen eines Termins „Wiederholen“ wählen."})));
  const W=st.wiederkehrend;
  if(W.length) m.append(h("section",{class:"block"},h("div",{class:"bh"},h("h3",{text:"Wöchentliche Termine (alt)"})),
    W.length?h("ul",{class:"items"},W.map(r=>h("li",{class:"item"},h("time",{},r.von||"–",r.bis?h("small",{text:r.bis}):null),
      h("div",{class:"body"},h("div",{class:"t",text:r.title}),h("div",{class:"m"},kindDot(r.kind||"termin"),`${(r.wds||[]).map(i=>DAYS[i]).join(", ")}, ${KINDS[r.kind]||"Termin"}`)),
      h("button",{class:"x","aria-label":`Serie ${r.title} löschen`,onclick:()=>{if(confirm(`„${r.title}“ aus allen Wochen löschen?`))upd(()=>{st.wiederkehrend=st.wiederkehrend.filter(x=>x.id!==r.id)})}},"×"))))
      :h("p",{class:"empty",text:"Noch keine. Beim Anlegen eines Termins „Jede Woche wiederholen“ anhaken."})));

  m.append(h("section",{class:"block"},h("div",{class:"bh"},h("h3",{text:"Wasserziel"})),
    h("div",{class:"add"},h("input",{type:"number",min:"1",max:"10",value:st.waterGoal,class:"num","aria-label":"Liter pro Tag",onchange:e=>upd(()=>{st.waterGoal=Math.max(1,Math.min(10,+e.target.value||3))})}),
      h("span",{class:"muted",text:"Liter pro Tag, jedes Feld = 1 Liter"}))));

  m.append(h("section",{class:"block"},h("div",{class:"bh"},h("h3",{text:"Synchronisierung"})),
    h("p",{class:"note",text:`Angemeldet als ${S.email||""}. Deine Einträge liegen in deiner eigenen Supabase-Datenbank und sind auf allen Geräten gleich, auf denen du angemeldet bist. Ohne Netz wird lokal gespeichert und später nachgeholt.`}),
    h("div",{class:"add"},h("button",{class:"btn",onclick:async()=>{if(confirm("Abmelden?")){await S.sb.auth.signOut();location.reload()}}},"Abmelden"))));
  m.append(exportSection());
  m.append(importSection());
}
function exportSection(){
  const out=h("textarea",{class:"exp",readonly:true,rows:"6","aria-label":"Exportierte Daten",hidden:true});
  const msg=h("p",{class:"note"});
  const run=async()=>{
    if(!S.persist){msg.textContent="Nichts zu exportieren, gerade wird nicht gespeichert.";return}
    msg.textContent="Exportiere …";
    try{
      const docs=await exportDocs();
      out.value=JSON.stringify({app:"wochenplaner",version:1,exported:new Date().toISOString(),docs});
      out.hidden=false; out.select();
      let copied=false; try{await navigator.clipboard.writeText(out.value);copied=true}catch(_){}
      msg.textContent=`${Object.keys(docs).length} Einträge exportiert. `+(copied?"Ist in der Zwischenablage.":"Text markieren und kopieren.");
    }catch(e){msg.textContent="Export fehlgeschlagen: "+(e&&e.message||e)}
  };
  return h("section",{class:"block"},h("div",{class:"bh"},h("h3",{text:"Daten exportieren"})),
    h("p",{class:"note",text:"Kopiert alle Einträge als Text, z.B. für den Umzug in die eigene App oder als Sicherung."}),
    h("div",{class:"add"},h("button",{class:"btn",onclick:run},"Export erstellen")),msg,out);
}
async function exportDocs(){
  const {data,error}=await S.sb.from("docs").select("path,data");
  if(error) throw error;
  const docs={}; (data||[]).forEach(r=>{docs[r.path]=r.data}); return docs;
}
function importSection(){
  const ta=h("textarea",{class:"exp",rows:"5",placeholder:"Exportierten Text hier einfügen","aria-label":"Daten zum Importieren"});
  const msg=h("p",{class:"note"});
  const run=async()=>{
    let obj; try{obj=JSON.parse(ta.value.trim())}catch(_){msg.textContent="Das ist kein gültiger Export.";return}
    const docs=obj&&obj.docs; if(!docs||typeof docs!=="object"){msg.textContent="Im Text sind keine Daten.";return}
    const n=Object.keys(docs).length;
    if(!confirm(`${n} Einträge importieren? Gleichnamige Einträge hier werden überschrieben.`))return;
    msg.textContent="Importiere …";
    try{await S.db.importAll(docs);msg.textContent="Fertig, lade neu …";setTimeout(()=>location.reload(),600)}
    catch(e){msg.textContent="Import fehlgeschlagen: "+(e&&e.message||e)}
  };
  return h("section",{class:"block"},h("div",{class:"bh"},h("h3",{text:"Daten importieren"})),
    h("p",{class:"note",text:"Für den Umzug aus der Claude-Version: dort unter Einstellungen „Export erstellen“, Text kopieren und hier einfügen."}),
    ta,h("div",{class:"add"},h("button",{class:"btn",onclick:run},"Importieren")),msg);
}

/* ---------- Supabase-Speicher ---------- */
function makeDb(sb,uid){
  const listeners=new Map();
  const CK=k=>`wp-cache-${uid}-${k}`, QK=`wp-queue-${uid}`;
  const snapOf=(d,fromCache)=>({exists:d!=null,data:()=>d,metadata:{fromCache,hasPendingWrites:false}});
  const loadQ=()=>{try{return JSON.parse(localStorage.getItem(QK)||"{}")}catch(_){return {}}};
  const saveQ=q=>{try{localStorage.setItem(QK,JSON.stringify(q))}catch(_){}};
  const cache=(k,d)=>{try{localStorage.setItem(CK(k),JSON.stringify(d))}catch(_){}};
  const cached=k=>{try{const c=localStorage.getItem(CK(k));return c===null?undefined:JSON.parse(c)}catch(_){return undefined}};
  async function fetchKey(k){const {data,error}=await sb.from("docs").select("data").eq("path",k).maybeSingle();if(error)throw error;const d=data?data.data:null;cache(k,d);return d}
  async function upsert(k,d){const {error}=await sb.from("docs").upsert({user_id:uid,path:k,data:d,updated_at:new Date().toISOString()});if(error)throw error}
  const emit=(k,d,fc)=>{(listeners.get(k)||new Set()).forEach(fn=>{try{fn(snapOf(d,fc))}catch(e){console.error(e)}})};
  async function refresh(k){const q=loadQ();if(k in q)return;try{emit(k,await fetchKey(k),false)}catch(_){}}
  async function flush(){const q=loadQ();for(const [k,d] of Object.entries(q)){try{await upsert(k,d);const q2=loadQ();if(JSON.stringify(q2[k])===JSON.stringify(d)){delete q2[k];saveQ(q2)}}catch(_){return false}}setSync("ok");return true}
  sb.channel("docs-"+uid).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:`user_id=eq.${uid}`},p=>{
    const row=(p.new&&p.new.path)?p.new:p.old; if(!row||!row.path) return;
    if(row.path in loadQ()) return;
    const d=p.eventType==="DELETE"?null:p.new.data; cache(row.path,d); emit(row.path,d,false);
  }).subscribe();
  const wake=()=>{flush().then(()=>{for(const k of listeners.keys())refresh(k)})};
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake()});
  window.addEventListener("online",wake);
  setTimeout(()=>{if(Object.keys(loadQ()).length)flush()},1500);
  const keyOf=p=>p.split("/").pop();
  return {
    doc(path){const k=keyOf(path);return {
      onSnapshot(cb,err){
        if(!listeners.has(k))listeners.set(k,new Set()); listeners.get(k).add(cb);
        const q=loadQ(); const c=(k in q)?q[k]:cached(k);
        if(c!==undefined) setTimeout(()=>cb(snapOf(c,true)),0);
        fetchKey(k).then(d=>{const q2=loadQ();cb(snapOf(k in q2?q2[k]:d,false))},e=>{if(c===undefined&&err)err(e)});
        return ()=>{const set=listeners.get(k);if(set)set.delete(cb)};
      },
      async get(){const q=loadQ();if(k in q)return snapOf(q[k],true);try{return snapOf(await fetchKey(k),false)}catch(_){const c=cached(k);return snapOf(c===undefined?null:c,true)}},
      async set(d){
        const q=loadQ();q[k]=d;saveQ(q);cache(k,d);
        try{await upsert(k,d);const q2=loadQ();if(JSON.stringify(q2[k])===JSON.stringify(d)){delete q2[k];saveQ(q2)}}
        catch(e){const err=new Error("offline");err.code=navigator.onLine?"save_failed":"offline";throw err}
      }
    }},
    async importAll(docs){for(const [k,d] of Object.entries(docs)){await upsert(k,d);cache(k,d)}}
  };
}

/* ---------- Anmeldung ---------- */
S.auth="boot";
function renderAuth(){
  const m=document.getElementById("main"); m.replaceChildren();
  document.getElementById("kw").textContent="Wochenplaner"; document.getElementById("range").textContent="";
  if(S.auth==="boot"){m.append(h("p",{class:"empty",text:"Lädt …"}));return}
  if(S.auth==="config"){m.append(h("div",{class:"login"},h("h2",{text:"Noch nicht eingerichtet"}),
    h("p",{class:"muted",text:"Trag in config.js deine Supabase-Adresse und den anon-Schlüssel ein. Siehe ANLEITUNG.md."})));return}
  const email=h("input",{type:"email",placeholder:"E-Mail",autocomplete:"email","data-keep":"login-mail"});
  const pw=h("input",{type:"password",placeholder:"Passwort (mind. 6 Zeichen)",autocomplete:"current-password","data-keep":"login-pw"});
  const msg=h("p",{class:"note"});
  const go=async(mode)=>{
    const e=email.value.trim(),p=pw.value; if(!e||p.length<6){msg.textContent="E-Mail und Passwort mit mindestens 6 Zeichen eingeben.";return}
    msg.textContent=mode==="up"?"Konto wird erstellt …":"Anmelden …";
    const r=mode==="up"?await S.sb.auth.signUp({email:e,password:p}):await S.sb.auth.signInWithPassword({email:e,password:p});
    if(r.error){msg.textContent=r.error.message==="Invalid login credentials"?"E-Mail oder Passwort falsch.":r.error.message;return}
    if(mode==="up"&&!r.data.session){msg.textContent="Bestätigungs-Mail ist raus. Link öffnen, dann hier anmelden.";return}
  };
  pw.addEventListener("keydown",e=>{if(e.key==="Enter")go("in")});
  m.append(h("div",{class:"login"},h("h2",{text:"Anmelden"}),h("p",{class:"muted",text:"Einmal pro Gerät. Danach bleibst du angemeldet."}),email,pw,
    h("div",{class:"row"},h("button",{class:"btn primary",onclick:()=>go("in")},"Anmelden"),h("button",{class:"btn",onclick:()=>go("up")},"Konto erstellen")),msg));
}
function startWith(session){
  if(S.persist) return;
  S.auth="ok"; S.uid=session.user.id; S.email=session.user.email;
  S.db=makeDb(S.sb,S.uid); S.persist=true;
  subscribeSettings(); loadWeek();
}
(function boot(){
  const C=window.PLANER_CONFIG||{};
  if(!window.supabase||!C.supabaseUrl||!C.supabaseAnonKey||/DEIN/.test(C.supabaseUrl+C.supabaseAnonKey)){S.auth="config";render();return}
  S.sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"wp-auth"}});
  S.sb.auth.getSession().then(({data})=>{if(data&&data.session)startWith(data.session);else{S.auth="login";render()}});
  S.sb.auth.onAuthStateChange((ev,session)=>{if(session&&!S.persist)startWith(session)});
  if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  // Minutentakt für "Als Nächstes" und die Jetzt-Linie
  setInterval(()=>{if(S.auth==="ok"&&document.visibilityState==="visible"&&!document.activeElement.matches("input,textarea,select"))render()},60000);
})();
